name: ✨ Feature request
description: Suggest a new feature or an improvement to an existing one.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.
        Describing the need first helps finding the best solution.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the [existing issues](https://github.com/ppoilbarbe/PBRenamer/issues?q=is%3Aissue) and found no similar request.
          required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem or need does this address? When does it occur?
      placeholder: e.g. When I rotate a few hundred images, the window shows no progress and looks frozen.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should PBRenamer do? Describe the expected behaviour.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you thought of.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Pattern renaming
        - Schema renaming
        - Sidecar files
        - File list, preview
        - Image viewer, rotations, EXIF
        - Metadata (image, audio, video)
        - Profiles, settings
        - Command line, headless mode
        - Translations
        - Documentation
        - Other
    validations:
      required: false

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Optional checklist of what the feature must do to be complete.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mock-ups, screenshots, links, examples of file names…
    validations:
      required: false
