name: 🐞 Bug report
description: Something does not work as it should (wrong result, error, crash).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        The more precise the report, the faster it can be fixed.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the [existing issues](https://github.com/ppoilbarbe/PBRenamer/issues?q=is%3Aissue) and found no report of this problem.
          required: true
        - label: I checked the [user guide](https://pbrenamer.readthedocs.io/en/latest/user_guide.html).
          required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What goes wrong? One or two sentences are enough.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence of actions that shows the problem.
      placeholder: |
        1. Open a folder holding …
        2. Select …
        3. Click …
        4. See …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened? Quote error messages exactly.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: PBRenamer version
      description: Shown in **Help → About**, or by `pbrenamer --version`.
      placeholder: e.g. 2.2.2
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Ubuntu 24.04, Windows 11, macOS 15 (Apple Silicon)
    validations:
      required: false

  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - Executable from a GitHub release
        - PyPI (pip / pipx)
        - Source (git clone)
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Python environment
      description: Only for an installation from PyPI or from source.
      options:
        - Not applicable (release executable)
        - System level
        - User level, without environment
        - Python virtualenv
        - Conda / pixi environment
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Pattern renaming
        - Schema renaming
        - Sidecar files
        - File list, preview
        - Image viewer, rotations, EXIF
        - Metadata (image, audio, video)
        - Profiles, settings
        - Command line, headless mode
        - Translations
        - Other
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: |
        If possible, start PBRenamer with `--debug` from a terminal,
        reproduce the problem, and paste the relevant output here.
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Screenshots and additional context
      description: Drag and drop screenshots here, or add any other useful detail.
    validations:
      required: false
