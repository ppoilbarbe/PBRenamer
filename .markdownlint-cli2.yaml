config:
  # Line length: prose only (tables and code blocks may be wider)
  MD013:
    line_length: 100
    tables: false
    code_blocks: false
  # Duplicate headings allowed when they live under different parent sections
  # (standard Keep-a-Changelog pattern: ### Added, ### Fixed repeat per release)
  MD024:
    siblings_only: true

# CLAUDE.md is intentionally compact tool-specific files
ignores:
  - CLAUDE.md
  - .pytest_cache/**
