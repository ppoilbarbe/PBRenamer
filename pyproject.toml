[build-system]
requires = ["hatchling", "babel>=2.9"]
build-backend = "hatchling.build"

[project]
name = "pbrenamer"
version = "2.0.0"
description = "A graphical batch file renaming utility"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Marcel Spock", email = "mrspock@cardolan.net" }]
keywords = ["renamer", "batch", "files", "gui", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
    "Topic :: Desktop Environment :: File Managers",
]
requires-python = ">=3.12"
dependencies = ["pyside6"]

[project.optional-dependencies]
# Metadata fields {im:…} (Pillow fallback), {au:…} and {vi:…}
meta = ["pillow", "mutagen", "pymediainfo"]
# Image tools: EXIF/IPTC/XMP read-write, HEIC/HEIF support
# (no pyexiv2 wheel for Intel macOS: Pillow is the fallback there)
images = [
    "pillow",
    "pillow-heif",
    "pyexiv2 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
    "pytest-qt",
    "pytest-cov",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autobuild",
    "sphinx-intl",
    "build",
    "twine",
]

[project.scripts]
pbrenamer = "pbrenamer.__main__:main"

[project.urls]
Homepage   = "https://github.com/ppoilbarbe/PBRenamer"
Repository = "https://github.com/ppoilbarbe/PBRenamer"
Issues     = "https://github.com/ppoilbarbe/PBRenamer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pbrenamer"]

[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = [
    "-v",
    "--cov=pbrenamer",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-m", "not perf",
]
markers   = ["perf: performance tests, run by `make perf` only"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length    = 88
target-version = "py312"
src            = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle       — style errors (indentation, whitespace…)
    "F",   # pyflakes          — undefined names, unused imports…
    "W",   # pycodestyle       — style warnings
    "I",   # isort             — import ordering
    "N",   # pep8-naming       — naming conventions
    "UP",  # pyupgrade         — modernise syntax to target Python version
]
extend-select = [
    "PGH", # pygrep-hooks      — grep-based checks (no bare `type: ignore`, deprecated calls…)
    "BLE", # flake8-blind-except — forbid bare `except Exception` without re-raise
]

[tool.ruff.lint.per-file-ignores]
# _() is installed into builtins by gettext at runtime — not a real F821
"src/pbrenamer/ui/main_window.py"         = ["F821"]
"src/pbrenamer/ui/action_bar.py"          = ["F821"]
"src/pbrenamer/ui/file_list.py"           = ["F821"]
"src/pbrenamer/ui/rule_panel_pattern.py"  = ["F821"]
"src/pbrenamer/ui/settings_dialog.py"     = ["F821"]
"src/pbrenamer/ui/pattern_help.py"        = ["F821"]
"src/pbrenamer/ui/keyboard_help.py"       = ["F821"]
"src/pbrenamer/ui/shortcuts_dialog.py"    = ["F821"]
"src/pbrenamer/ui/file_info_window.py"    = ["F821"]
"src/pbrenamer/platform/bookmarks.py"     = ["F821"]
"src/pbrenamer/core/sidecar.py"           = ["F821"]
"src/pbrenamer/core/schema.py"            = ["F821"]
"src/pbrenamer/profiles.py"               = ["F821"]
"src/pbrenamer/ui/sidecar_dialog.py"      = ["F821"]
"src/pbrenamer/ui/rule_panel_schema.py"   = ["F821"]
"src/pbrenamer/ui/profile_dialog.py"      = ["F821"]
"src/pbrenamer/ui/history_dialog.py"      = ["F821"]
"src/pbrenamer/core/image_ops.py"         = ["F821"]
"src/pbrenamer/platform/_open_linux.py"   = ["F821"]
"src/pbrenamer/platform/_open_macos.py"   = ["F821"]
"src/pbrenamer/ui/image_actions.py"       = ["F821"]
"src/pbrenamer/ui/image_viewer.py"        = ["F821"]
"src/pbrenamer/ui/metadata_view.py"       = ["F821"]
"src/pbrenamer/ui/orphan_sidecars_dialog.py" = ["F821"]
"src/pbrenamer/ui/schema_proposal_dialog.py" = ["F821"]
"src/pbrenamer/core/image_meta.py"        = ["F821"]
# *_ui.py: Qt naming conventions (Ui_Foo, setupUi) + _() builtin from gettext
"src/pbrenamer/ui/*_ui.py"                = ["F821", "N801", "N802"]

[tool.ruff.format]
# Black-compatible defaults (double quotes, trailing commas, magic trailing comma)
quote-style               = "double"
indent-style              = "space"
skip-magic-trailing-comma = false
line-ending               = "lf"

[tool.pixi.workspace]
channels  = ["conda-forge"]
# pyexiv2 (PyPI) only ships macosx_14_0_arm64 wheels, hence the __osx=14.0 virtual
# package on osx-arm64 (past pixi's default of 13.0); osx-64 has no wheel at all.
platforms = ["linux-64", "osx-64", { platform = "osx-arm64", "__osx" = "14.0" }, "win-64"]

[tool.pixi.dependencies]
python                 = "3.12.*"
pyside6                = ">=6.11.1,<7"
fonts-conda-ecosystem  = ">=1,<2"
pytest                 = ">=9.2.0,<10"
pytest-qt              = ">=4.5.0,<5"
pytest-cov             = ">=7.1.0,<8"
sphinx                 = ">=9.1.1,<10"
sphinx-rtd-theme       = ">=3.1.0,<4"
sphinx-autobuild       = ">=2025.8.25,<2026"
sphinx-intl            = ">=2.3.2,<3"
ruff                   = ">=0.17.3,<0.18"
pre-commit             = ">=4.7.0,<5"
gh                     = ">=2.103.3,<3"
babel                  = ">=2.18.0,<3"
pillow                 = ">=13.0.0,<14"
pillow-heif            = ">=1.8.1,<2"
mutagen                = ">=1.48.1,<2"
pymediainfo            = ">=7.0.1,<8"
pyinstaller            = ">=6.22.3,<7"
python-build           = ">=1.6.1,<2"
twine                  = ">=7.0.0,<8"
pixi-pycharm = ">=0.0.12,<0.0.13"

[tool.pixi.pypi-dependencies]
pbrenamer = { path = ".", editable = true }

# pyexiv2 is not on conda-forge and has no osx-64 wheel: osx-64 falls back to Pillow.
[tool.pixi.target.linux-64.pypi-dependencies]
pyexiv2 = ">=2.16.0, <3"

[tool.pixi.target.win-64.pypi-dependencies]
pyexiv2 = ">=2.16.0, <3"

[tool.pixi.target.osx-arm64.pypi-dependencies]
pyexiv2 = ">=2.15.5, <3"
